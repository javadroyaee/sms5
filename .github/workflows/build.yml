name: Build JRweb Bank SMS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APK
        run: gradle assembleDebug assembleRelease

      - name: Sign Release APK
        if: env.KEY != ''
        env:
          KEY: ${{ secrets.KEY }}
        run: |
          echo "$KEY" | base64 -d > release.keystore
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          $APKSIGNER sign --ks release.keystore --ks-pass pass:123456 --key-pass pass:123456 --out app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JRweb-Bank-SMS-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-release-signed.apk
